<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ppVideoDownloader</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-mark" aria-hidden="true">V</div>
        <div class="heading">
          <h1 id="app-title"></h1>
        </div>
        <button id="scan-button" class="icon-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5m-4.1-2a7.5 7.5 0 0 1 12.7-3L20 12M4 12l2.4 5a7.5 7.5 0 0 0 12.7-3"/></svg>
        </button>
        <button id="close-panel-button" class="icon-button embedded-close" type="button"></button>
      </header>
      <section class="status-row" aria-live="polite">
        <span class="status-dot"></span>
        <span id="status-text"></span>
        <span id="video-count" class="count"></span>
      </section>
      <section id="video-list" class="video-list"></section>
      <div id="download-notice" class="download-notice" aria-live="polite"></div>
      <footer id="download-status" class="footnote" aria-live="polite">pp</footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
